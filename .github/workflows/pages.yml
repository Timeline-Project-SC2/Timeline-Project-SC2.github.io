name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # ubuntu-latest с 19.10 по 19.11.2026 переезжает на Ubuntu 26.04 (actions/runner-images#14748).
    # Сборка от системы не зависит: Python ставит setup-python, Pillow — из tools/requirements.txt,
    # а check.yml гоняет те же шаги на 24.04 и 26.04 в каждом PR. Если что-то всё же сломается —
    # вернуть прежний образ одной строкой: runs-on: ubuntu-24.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Кэш производных изображений галактики, логотипа и макетов.
      # Ключ учитывает все исходники и логику сборки; при промахе workflow пересобирает и сохраняет их.
      - name: Восстановить кэш изображений
        id: image-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            assets/galaxy-map-*.webp
            assets/timeline-project-logo.webp
            assets/koprulu-macket.webp
            assets/ozd-macket.webp
          key: pages-images-${{ runner.os }}-${{ hashFiles('assets/src/**', 'tools/build_assets.py', 'tools/requirements.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Публикуется собранная Vite папка .publish — это корень сайта.
      # В Settings → Pages → Source должен стоять «GitHub Actions», иначе воркфлоу
      # не публикует: Pages будет отдавать корень репозитория через Jekyll.
      # Картинки собираются здесь из assets/src/: в Git лежат только исходники,
      # производные пиксели попадают сразу в артефакт.
      # data/ и assets/ живут в корне репозитория (data/ пишет sync.py); Vite
      # включает их в .publish на шаге сборки публикации, assets/src исключает.
      - name: Собрать картинки
        run: |
          python -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
          if [ "${{ steps.image-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Кэш найден: пересборку растров пропускаем"
            python tools/build_assets.py --sync-only
          else
            echo "Кэша нет: собираем изображения"
            time python tools/build_assets.py
          fi
      - name: Сохранить кэш изображений
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            assets/galaxy-map-*.webp
            assets/timeline-project-logo.webp
            assets/koprulu-macket.webp
            assets/ozd-macket.webp
          key: pages-images-${{ runner.os }}-${{ hashFiles('assets/src/**', 'tools/build_assets.py', 'tools/requirements.txt') }}
      - name: Собрать публикацию
        run: |
          npm ci
          npm run build
          npm run verify:publish
          npm run verify:contract
          test ! -e .publish/assets/src
          du -sh .publish/* | sort -h
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./.publish
      - id: deployment
        uses: actions/deploy-pages@v5
