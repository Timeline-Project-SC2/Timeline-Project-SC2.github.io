name: Sync upstream map data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]

permissions:
  contents: write   # <-- ИСПРАВЛЕНО: даём права на запись в репозиторий
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # ИСПРАВЛЕНО: передаём токен прямо в checkout и используем v4
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_BOT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync.py

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then echo "no webhook configured"; exit 0; fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ Sync failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK" || true

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Sync failed" --body "Автосинк упал. См. логи: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Commit and push if changed
        if: success()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            SHA=$(python3 -c "import json; d=json.load(open('data/upstream/manifest.json')); print(list(d.get('sources',{}).values())[0].get('sha','')[:7])")
            git commit -m "sync: upstream @ ${SHA}"
            git push origin HEAD
          fi

      - name: Notify Discord on success (changes)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then exit 0; fi
          if git diff --quiet HEAD~1 HEAD 2>/dev/null; then exit 0; fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ Sync updated: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK" || true
