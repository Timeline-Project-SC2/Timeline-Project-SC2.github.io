name: Проверка сборки

# Одна сборка обязательна всегда. Вторая ОС — по изменениям окружения,
# еженедельно и при ручном full; завершение миграции: issue #382.
# Имена проверок сохранены: ненужные тяжёлые шаги отмечаются skipped.
on:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Полный прогон: вторая ОС и планетарные проверки'
        type: boolean
        default: true

# Новый push отменяет только устаревшие проверки того же PR, не Pages и не sync.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Сборка на ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Выбрать тяжёлые проверки
        id: scope
        run: node tools/ci_scope.mjs
      - uses: actions/setup-python@v7
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Синтаксис скриптов Python
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: python -m py_compile tools/build_assets.py tools/sync.py tools/planet_generation.py
      - name: Профили генерации планет
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: |
          python tools/planet_generation.py validate
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Документация — лимит 200 строк и битые ссылки
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: python tools/check_docs.py
      - name: Собрать картинки
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: |
          python -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
          python tools/build_assets.py
          python tools/build_assets.py --check
          python tools/build_assets.py --sync-only
          python tools/build_assets.py --check
      - name: Собрать публикацию
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: |
          npm ci
          npm run build
          npm run verify:publish
          npm run verify:no-raster
          npm run verify:contract
          test ! -e .publish/assets/src
          du -sh .publish/* | sort -h
          # Маршруты и данные на месте; hashed JS/CSS/worker проверяет
          # tools/verify_feature_parity.mjs по build-manifest.json.
          for f in index.html sector/index.html minimal/minimal.html cursor-test/index.html \
                   spiral-test/index.html planet-test/index.html planet-globe/index.html build-manifest.json \
                   assets/galaxy-map-3000.webp data/systems.csv data/places.csv \
                   data/planet-generation.csv; do
            test -s ".publish/$f" || { echo "нет файла: $f"; exit 1; }
          done
      - name: Побитовая эквивалентность FULL EQ (verify:hashes)
        if: matrix.os == 'ubuntu-24.04' || steps.scope.outputs.compatibility == 'true'
        run: npm run verify:hashes

  scripts:
    name: Скрипты сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Джоба бинарная: каждая проверка — отдельный шаг со своим success/failure
      # в API прогона. Раньше всё лежало в одном run:-блоке, красный npm test
      # обрывал его на середине, и шаги ниже (lint, check:planet-core)
      # не исполнялись вообще — «привычно красный CI» скрывал и новые падения,
      # и поломки линта (внешний аудит 26.10.2026, решение E1).
      - name: Установка зависимостей (npm ci)
        run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      # node --check ловит синтаксис, eslint (no-undef) — обращения к необъявленным
      # переменным: такая ошибка после чистки кода сломала перетаскивание карты сектора.
      # Настройки — eslint.config.mjs в корне репозитория.
      - name: Синтаксис скриптов
        run: |
          find site -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do node --check "$f"; done
          find tools -type f -name '*.mjs' -print0 | sort -z | while IFS= read -r -d '' f; do node --check "$f"; done
          find tests -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | sort -z | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: "Верификатор: адреса сектора"
        run: npm run verify:address
      - name: "Верификатор: ядро сектора"
        run: npm run verify:sector-core
      - name: "Верификатор: ноль растра"
        run: npm run verify:no-raster
      - name: Тесты node:test
        run: node --test --test-concurrency=1 tests/*.test.mjs tests/*.test.js
      # Wasm-ядра planet-core (CR-01 PR 4): закоммиченные байты в
      # src/planet/planet-core-bytes.ts обязаны совпадать с пересборкой
      # AssemblyScript-исходников, иначе ускорение молча расходится с кодом.
      - name: "Wasm-ядро planet-core: сверка байтов"
        run: npm run check:planet-core
      - name: Линт ESLint (site, src, tools, tests)
        run: npm run lint

  planet-perf:
    name: Planet CPU performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Выбрать тяжёлые проверки
        id: scope
        run: node tools/ci_scope.mjs
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.planet == 'true'
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.planet == 'true'
        with:
          python-version: '3.12'
      # CPU-only regression gate. Frame time is intentionally not measured
      # in CI: hosted runners have no representative GPU, and SwiftShader
      # pacing would create false failures. The bench covers mesh build,
      # deterministic typed-array memory and pick on Node.js.
      - name: Mesh build / memory / pick regression bench
        if: steps.scope.outputs.planet == 'true'
        run: node tools/bench_planet_ci.mjs --baseline=baseline-2026-10-20.json
      - name: Stage 3 v128 topology / chunk / binary-cache bench
        if: steps.scope.outputs.planet == 'true'
        run: node tools/bench_planet_stage3.mjs --v=128 --reps=1 --picks=200
      - name: Stage 4 v128 fields / C100-soft G2 bench
        if: steps.scope.outputs.planet == 'true'
        run: node tools/bench_planet_stage4.mjs --seeds=5
      - name: Stage 5 v128 hydrology / biomes G3 bench
        if: steps.scope.outputs.planet == 'true'
        run: node tools/bench_planet_stage5.mjs --seeds=5
      - name: Stage 6 v128 globe geometry / color layers / pick bench
        if: steps.scope.outputs.planet == 'true'
        run: node tools/bench_planet_stage6.mjs --seeds=3
