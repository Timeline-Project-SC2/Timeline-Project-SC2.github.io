name: Проверка сборки

# Каждый PR собирается так же, как при деплое (pages.yml), но ничего не публикуется.
# Матрица образов: Ubuntu 24.04 (сейчас это ubuntu-latest) и Ubuntu 26.04 — на неё GitHub
# переводит ubuntu-latest с 19.10 по 19.11.2026 (actions/runner-images#14748), поэтому
# переезд деплоя проверяется заранее. Шаги сборки повторяют pages.yml: меняя одно,
# поправьте и другое.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка на ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Синтаксис скриптов Python
        run: python -m py_compile tools/build_assets.py tools/sync.py tools/planet_generation.py
      - name: Профили генерации планет
        run: |
          python tools/planet_generation.py validate
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Документация — лимит 200 строк и битые ссылки
        run: python tools/check_docs.py
      - name: Собрать картинки
        run: |
          python -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
          python tools/build_assets.py
          python tools/build_assets.py --check
          python tools/build_assets.py --sync-only
          python tools/build_assets.py --check
      - name: Собрать публикацию
        run: |
          npm ci
          npm run build
          npm run verify:publish
          npm run verify:no-raster
          npm run verify:contract
          test ! -e .publish/assets/src
          du -sh .publish/* | sort -h
          # Маршруты и данные на месте; hashed JS/CSS/worker проверяет
          # tools/verify_feature_parity.mjs по build-manifest.json.
          for f in index.html sector/sector.html minimal/minimal.html cursor-test/index.html \
                   spiral-test/index.html planet-test/index.html planet-globe/index.html build-manifest.json \
                   assets/galaxy-map-3000.webp data/systems.csv data/places.csv \
                   data/planet-generation.csv; do
            test -s ".publish/$f" || { echo "нет файла: $f"; exit 1; }
          done
      - name: Побитовая эквивалентность FULL EQ (verify:hashes)
        run: npm run verify:hashes

  scripts:
    name: Скрипты сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # node --check ловит синтаксис, eslint (no-undef) — обращения к необъявленным
      # переменным: такая ошибка после чистки кода сломала перетаскивание карты сектора.
      # Настройки — eslint.config.mjs в корне репозитория.
      - name: Синтаксис и необъявленные переменные
        run: |
          npm ci
          npm run typecheck
          find site -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do node --check "$f"; done
          node tests/travel-planner.test.js
          # Верификаторы ядра сектора стоят ДО npm test намеренно: в этом блоке
          # шаги выполняются последовательно, и красный npm test (сейчас — 8
          # известных падений планетарного контура, вне задачи сектора) обрывает
          # блок, из-за чего стоявшие ниже шаги не выполнялись вообще.
          npm run verify:address
          npm run verify:sector-core
          npm run verify:no-raster
          npm test
          # Wasm-ядра planet-core (CR-01 PR 4): закоммиченные байты в
          # src/planet/planet-core-bytes.ts обязаны совпадать с пересборкой
          # AssemblyScript-исходников, иначе ускорение молча расходится с кодом.
          npm run check:planet-core
          npm run lint

  planet-perf:
    name: Planet CPU performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # CPU-only regression gate. Frame time is intentionally not measured
      # in CI: hosted runners have no representative GPU, and SwiftShader
      # pacing would create false failures. The bench covers mesh build,
      # deterministic typed-array memory and pick on Node.js.
      - name: Mesh build / memory / pick regression bench
        run: node tools/bench_planet_ci.mjs --baseline=baseline-2026-10-20.json
      - name: Stage 3 v128 topology / chunk / binary-cache bench
        run: node tools/bench_planet_stage3.mjs --v=128 --reps=1 --picks=200
      - name: Stage 4 v128 fields / C100-soft G2 bench
        run: node tools/bench_planet_stage4.mjs --seeds=5
      - name: Stage 5 v128 hydrology / biomes G3 bench
        run: node tools/bench_planet_stage5.mjs --seeds=5
      - name: Stage 6 v128 globe geometry / color layers / pick bench
        run: node tools/bench_planet_stage6.mjs --seeds=3
