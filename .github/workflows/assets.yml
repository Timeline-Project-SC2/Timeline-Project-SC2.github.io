name: Build image assets

# Пересборка картинок из исходников assets/src/: карта галактики, логотип,
# макеты. Результат не коммитится (производные пиксели в Git не хранятся) —
# он выкладывается артефактом, чтобы посмотреть результат до деплоя.
# Сам деплой собирает картинки сам, этот воркфлоу нужен для проверки.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
      - name: Build assets
        run: python tools/build_assets.py --force
      - uses: actions/upload-artifact@v7
        with:
          name: site-images
          path: |
            assets/*.webp
          if-no-files-found: error
