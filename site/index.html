<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03110f">
  <meta name="description" content="Карта галактики: переход к карте сектора.">
  <title>Timeline Project — Galaxy Map</title>
  <!-- логотип экрана загрузки: первым в стеке, чтобы загрузка не появлялась пустой -->
  <link rel="preload" as="image" href="/assets/timeline-project-logo.webp?v=0f419d0e" fetchpriority="high">
  <link rel="stylesheet" href="/shared/styles.css?v=structure-1">
  <link rel="stylesheet" href="/shared/timeline-skin.css?v=structure-1">
  <link rel="stylesheet" href="/shared/catalog-typography.css?v=structure-1">
  <link rel="stylesheet" href="galaxy.css?v=frame-5">
</head>
<body>
  <script src="/shared/timeline-loader.js"></script>

  <!-- Шапка как у сектора Копрулу: плашка по центру, список секторов и логотип справа -->
  <header class="topbar galaxy-topbar">
      <!-- Список секторов: кнопка-иконка в шапке; открывает шторку с полной высотой -->
      <div class="sectors-sidebar" id="sectorsSidebar">
        <button class="icon-button sectors-toggle" id="sectorsToggle" type="button"
                aria-expanded="false" aria-controls="sectorsList" aria-label="Список секторов" title="Список секторов">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 12h10M4 17h10M17 9l3 3-3 3"></path></svg>
        </button>
      </div>

    <div class="brand-lockup" aria-label="Timeline Project — Galaxy Map">
      <div class="brand-copy"><strong>TIMELINE PROJECT</strong><span>GALAXY MAP</span></div>
    </div>

    <div class="topbar-right">
      <div class="brand-emblem corner-mark" role="img" aria-label="Timeline Project"></div>
    </div>
  </header>

  <!-- Затемнение и шторка списка областей (выезжает слева на полную высоту) -->
  <div class="sectors-backdrop" id="sectorsBackdrop"></div>
  <aside class="sectors-curtain" id="sectorsList" aria-label="Области сканирования">
    <div class="sectors-curtain-head">
      <span class="sectors-list-title">Области сканирования:</span>
      <button class="icon-button sectors-close" id="sectorsClose" type="button" aria-label="Закрыть список" title="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <ul class="sectors-items">
      <li>
        <button class="sector-list-item" type="button"
                data-cx="73.8167" data-cy="32.3167" data-size="1.8667"
                data-name="Сектор Копрулу">
          <span class="sector-list-thumb">
            <img src="/assets/koprulu-macket.webp?v=0f419d0e" alt="" width="48" height="48">
          </span>
          <span class="sector-list-name">Сектор Копрулу</span>
        </button>
      </li>
      <li>
        <button class="sector-list-item sector-list-item--zerus" type="button"
                data-zerus="1" data-name="Пространство Зеруса">
          <span class="sector-list-thumb sector-list-thumb--zerus" aria-hidden="true"></span>
          <span class="sector-list-name">Пространство Зеруса</span>
        </button>
      </li>
      <li>
        <button class="sector-list-item sector-list-item--odz" type="button"
                data-odz="1" data-name="Пространство Директората">
          <span class="sector-list-thumb">
            <img src="/assets/ozd-macket.webp?v=0f419d0e" alt="" width="48" height="48">
          </span>
          <span class="sector-list-name">Пространство Директората</span>
        </button>
      </li>
    </ul>
  </aside>

  <main class="galaxy-stage" id="galaxyStage">
    <!-- Фон как у карты сектора: градиент, сетка, виньетка (под картой) -->
    <div class="galaxy-bg" aria-hidden="true"><canvas class="galaxy-starfield" id="galaxyStarfield"></canvas></div>

    <!-- Слой карты: масштабируется и двигается целиком, хотспот внутри него -->
    <div class="map-layer" id="mapLayer">
      <!-- srcset: файл по размеру карты на экране. Карта — квадрат со стороной в меньшую
           сторону окна, отсюда sizes; при приближении galaxy.js поднимает sizes под реальный
           размер слоя, и браузер догружает файл крупнее (3000 px — исходник без ресайза) -->
      <img class="galaxy-map" id="galaxyMap" src="/assets/galaxy-map-2000.webp?v=0f419d0e"
           srcset="/assets/galaxy-map-1200.webp?v=0f419d0e 1200w, /assets/galaxy-map-2000.webp?v=0f419d0e 2000w, /assets/galaxy-map-3000.webp?v=0f419d0e 3000w"
           sizes="min(100vw, 100vh)" alt="Карта галактики" draggable="false" fetchpriority="high">

      <!-- Квадрат сектора: центр и размер в % карты (≈ 56 px на исходнике 3000 px), без подписи.
           data-frame — рамка выделения при выборе: «левый верх правый низ» в % карты, вокруг
           блока области на карте (квадрат, картинки CAM, надписи) с полем ≈ 0.9 % -->
      <button class="sector-hotspot" id="sectorHotspot" type="button"
              data-cx="73.8167" data-cy="32.3167" data-size="1.8667" data-name="Сектор Копрулу" data-macket="/assets/koprulu-macket.webp?v=0f419d0e"
              data-frame="59.6 21.35 97.35 40.7"
              aria-label="Сектор Копрулу"></button>

      <!-- Зерус: красная область без страницы (только анимация и сообщение) -->
      <button class="sector-hotspot sector-hotspot--zerus" id="zerusHotspot" type="button"
              style="left: 55.45%; top: 52.63%;"
              data-cx="55.45" data-cy="52.63" data-size="1.8667" data-name="Зерус"
              data-frame="43.1 41.0 76.85 58.45"
              aria-label="Зерус"></button>

      <!-- Пространство Директората (ОЗД): квадрат на метке UED SPACE -->
      <button class="sector-hotspot sector-hotspot--odz" id="odzHotspot" type="button"
              style="left: 49.1667%; top: 70.0%;"
              data-cx="49.1667" data-cy="70.0" data-size="1.8667"
              data-name="Пространство Директората" data-macket="/assets/ozd-macket.webp?v=0f419d0e"
              data-frame="35.45 62.0 74.35 80.25"
              aria-label="Пространство Директората"></button>
    </div>

    <!-- Строки отказа доступа ОЗД: печатаются по одной, затем гаснут -->
    <div class="odz-message" id="odzMessage" role="status" aria-live="polite" hidden></div>

    <!-- Сообщение для Зеруса: печатается по буквам, точка в конце моргает -->
    <div class="galaxy-error" id="galaxyError" role="alert" hidden>
      <span id="galaxyErrorText"></span><span class="galaxy-error-dot" aria-hidden="true">.</span>
    </div>

    <!-- Превью при ховере на хотспот: макет 300×300 (тот же, что в панели сектора) -->
    <div class="sector-preview" id="sectorPreview" aria-hidden="true">
      <span class="preview-caption">Предварительное изображение</span>
      <img src="/assets/koprulu-macket.webp?v=0f419d0e" alt="" width="300" height="300">
    </div>

    <!-- Управление картой: как на странице сектора -->
    <div class="map-controls" aria-label="Управление картой">
      <button class="map-control" id="zoomIn" type="button" title="Приблизить (+)" aria-label="Приблизить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
      <div class="zoom-readout"><span id="zoomPercent">100%</span><span class="zoom-tick"></span></div>
      <button class="map-control" id="zoomOut" type="button" title="Отдалить (−)" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"></path></svg></button>
      <div class="control-divider"></div>
      <button class="map-control" id="resetMap" type="button" title="Показать всю карту (0)" aria-label="Показать всю карту"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path><path d="M9 4a8 8 0 0 1 10 5M15 20a8 8 0 0 1-10-5"></path></svg></button>
    </div>

    <div class="map-hint"><span class="mouse-icon"><i></i></span><span>ПЕРЕТАСКИВАЙ · КОЛЁСО МЫШИ — МАСШТАБ</span></div>

    <!-- Боковая панель с краткой информацией -->
    <aside class="sector-panel" id="sectorPanel" hidden aria-label="Информация о секторе">
      <div class="sector-panel-head">
        <div class="eyebrow"><span class="eyebrow-line"></span> SECTOR DOSSIER</div>
        <button class="icon-button" id="closeSectorPanel" type="button" aria-label="Закрыть">×</button>
      </div>
      <div class="sector-panel-body">
        <h2 id="sectorPanelTitle">Сектор</h2>
        <p id="sectorPanelInfo">Краткая информация о секторе появится здесь.</p>
        <div class="sector-panel-icon">
          <span class="preview-caption">Предварительное изображение</span>
          <button class="sector-icon-button" id="sectorIconButton" type="button"
                  aria-label="Открыть карту сектора">
            <img src="/assets/koprulu-macket.webp?v=0f419d0e" alt="Карта сектора" width="300" height="300">
            <span class="sector-icon-caption">ОТКРЫТЬ КАРТУ</span>
          </button>
          <div class="sector-nodata-box" id="sectorNoData" hidden>no-data available</div>
        </div>
      </div>
    </aside>

  </main>

  <!-- Консоль после загрузки: печатает скрипт сверху вниз, висит 8 с (на мобильных 2 с) -->
  <div class="boot-console" id="bootConsole" hidden>
    <button class="boot-console-close" id="bootConsoleClose" type="button" aria-label="Закрыть консоль">×</button>
    <div class="boot-console-body" id="bootConsoleBody" aria-hidden="true"></div>
  </div>

  <script src="/shared/links.js?v=structure-1" defer></script>
  <script src="/shared/lag-fx.js?v=frame-1" defer></script>
  <script src="/shared/focus-fx.js?v=frame-10" defer></script>
  <script src="galaxy.js?v=frame-9" defer></script>
  <script src="/shared/cursor-fx.js?v=cursor-2" defer></script>
</body>
</html>
